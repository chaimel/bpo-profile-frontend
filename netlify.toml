# Netlify build configuration — the Netlify equivalent of an Apache .htaccess.
# Netlify ignores .htaccess files; redirects/headers belong here.

[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  # Vite 7+ (pulled in by Nuxt 3.21) requires Node >= 20.19 — don't rely on the site's default.
  NODE_VERSION = "22"

# Hashed build assets never change — cache them forever.
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Baseline hardening headers (what a typical .htaccess would set).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
